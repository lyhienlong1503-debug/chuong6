<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tiêu đề linh hoạt cho từng trang con -->
    <title>{% block title %}Hệ thống quản lý sinh viên{% endblock %}</title>
    <!-- Nhúng Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Thanh điều hướng chung -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/students">QL Sinh Viên</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/students">Danh sách</a>
                <a class="nav-link" href="/them-mau">Tạo dữ liệu mẫu</a>
            </div>
        </div>
    </nav>

    <!-- Khu vực chứa nội dung thay đổi linh hoạt của các trang con -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Nhúng Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
